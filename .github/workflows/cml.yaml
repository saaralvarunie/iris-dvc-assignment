name: ML Experiment with CML

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Iris dataset
        run: |
          mkdir -p data
          python -c "from sklearn.datasets import load_iris; load_iris(as_frame=True).frame.to_csv('data/iris.csv', index=False)"

      - name: Reproduce ML pipeline
        run: dvc repro

      - name: Generate metrics report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## ML Experiment Report" > report.md
          echo "### Current Metrics" >> report.md
          cat metrics.json >> report.md
          echo "" >> report.md
          echo "### Metrics Difference from Main" >> report.md
          dvc metrics diff origin/main --md >> report.md
          echo "" >> report.md
          echo "### Parameters Difference from Main" >> report.md
          dvc params diff origin/main --md >> report.md
          cml comment create report.md
